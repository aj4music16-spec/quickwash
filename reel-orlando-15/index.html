<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"navy","type":"color","label":"Brand navy","default":"#000099"},
    {"id":"accent","type":"color","label":"Brand orange","default":"#ff6600"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Poppins, sans-serif; }
      #stage { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <!-- "The $99 QuickWash, Orlando", 15 s cut (Meta lead form). 1080x1920, 30 fps, 470 frames. Cuts on the bed's 110 BPM beat grid; each
         section's line starts on its first cut (tools/vo_plan.py -> tools/cues.json -> tools/build.py). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.6666" data-width="1080" data-height="1920">
      <div id="stage" data-layout-ignore></div>
      <!-- 1. OPEN: detailer at the QuickWash van; chip + offer on frame 0 -->
      <div id="open" data-composition-id="open" data-composition-src="compositions/open.html" data-start="0" data-duration="3.6687"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <!-- 2. THE SERVICE: six shots, one per inclusion -->
      <div id="service" data-composition-id="service" data-composition-src="compositions/service.html" data-start="3.6666" data-duration="7.402"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <!-- 3. PRICE: "$99" on "Ninety-nine" (the shot runs on under the end-card wipe) -->
      <div id="price" data-composition-id="price" data-composition-src="compositions/price.html" data-start="11.0666" data-duration="2.002"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <!-- the package checklist over the service and the price -->
      <div id="checklist" data-composition-id="checklist" data-composition-src="compositions/checklist.html" data-start="3.6666" data-duration="9.002"
        data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <!-- 4. END CARD: the Orlando lead-form card wipes up on "Drop" -->
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="12.6666" data-duration="3.002"
        data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 7"></div>
      <!-- premix: ElevenLabs acoustic bed + Liam (eleven_v3), ducked, -14 LUFS (tools/mix.py) -->
      <audio id="mix" class="clip" data-start="0" data-duration="15.6666" data-track-index="4" data-volume="1" src="assets/audio/mix.m4a"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
