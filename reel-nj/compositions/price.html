    (function () {
      // local frame 0 = film frame 367. Beats: 31 -> local 20.5, 33 -> 45.5, 34 -> 58, 36 -> 83. Cut to the end card at local 108.
      const F = (f) => f / 30, WH = 16 / 30;
      const tl = gsap.timeline({ paused: true });
      const fe = document.querySelector("#price-fe"), blur = { b: 0 };
      const setBlur = () => fe.setAttribute("stdDeviation", blur.b.toFixed(2) + " 0");
      tl.fromTo("#price-strip", { x: 1080 }, { x: 0, duration: WH, ease: "power3.inOut" }, 0);
      tl.fromTo(blur, { b: 0 }, { b: 26, duration: WH / 2, ease: "power3.in", onUpdate: setBlur }, 0);
      tl.to(blur, { b: 0, duration: WH / 2, ease: "power3.out", onUpdate: setBlur }, WH / 2);
      setBlur();

      const show = (mod, n) => { const s = String(Math.round(n)).padStart(3, "x"); mod.querySelectorAll(".dg").forEach((d, i) => d.setAttribute("data-v", s[i])); };
      const STD = [99, 249, 399], WC = [69, 199, 349];
      // the standard prices roll up like a pump meter
      STD.forEach((v, i) => {
        const m = document.querySelector("#price-s" + i), c = { v: 0 };
        tl.fromTo(c, { v: 0 }, { v, duration: 0.42, ease: "power2.out", onUpdate: () => show(m, c.v) }, F(19) + i * F(4));
        show(m, 0);
      });
      // beat 33: the WashClub column switches on at the same prices...
      tl.fromTo("#price-wch", { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power4.out" }, F(45));
      tl.set("#price-wch", { opacity: 1 }, F(45));
      WC.forEach((v, i) => {
        const m = document.querySelector("#price-w" + i), c = { v: STD[i] };
        tl.set(m, { opacity: 1 }, F(46) + i * F(2));
        // ...and beat 34: they drop to the member price
        tl.fromTo(c, { v: STD[i] }, { v, duration: 0.4, ease: "power2.inOut", onUpdate: () => show(m, c.v) }, F(58) + i * F(4));
        show(m, STD[i]);
      });
      tl.set("#price-foot", { opacity: 1 }, F(50));
      tl.fromTo("#price-foot", { y: 26 }, { y: 0, duration: 0.18, ease: "power4.out" }, F(50));
      // the crane up: the sign sinks out of frame under the cloud
      tl.fromTo("#price-strip", { y: 0 }, { y: 300, duration: F(8), ease: "power4.in" }, F(100));
