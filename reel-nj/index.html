  <head>
    <meta charset="UTF-8" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #7ccdf4; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #7ccdf4; font-family: Inter, sans-serif; }

      /* The road world. Colours are variables so the black-and-white twin reuses the same drawing. */
      .bg { position: absolute; inset: 0; overflow: hidden;
        --sky1: #5fbdf0; --sky2: #b9e4fb; --cloud: #ffffff; --hillA: #a4dcc6; --hillB: #5fb87b;
        --grass: #6cc257; --lip: #57a947; --curb: #e1e5ea; --road: #474c56; --line: #f6f1e2; }
      .bg.old { --sky1: #bdbdb6; --sky2: #deded9; --cloud: #f2f2ee; --hillA: #b4b4ae; --hillB: #8d8d87;
        --grass: #9b9b95; --lip: #84847e; --curb: #d6d6d1; --road: #4b4b4b; --line: #e7e7e1; }
      .bg .sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 64%); }
      .bg .clouds { position: absolute; left: 0; top: 0; width: 1700px; height: 1300px; }
      .bg .cloud { position: absolute; fill: var(--cloud); }
      .bg .land { position: absolute; inset: 0; }
      .bg .hills { position: absolute; }
      .bg .hillsA { fill: var(--hillA); }
      .bg .hillsB { fill: var(--hillB); filter: url(#bg-f); }
      .bg .grass { position: absolute; left: 0; right: 0; top: 1440px; height: 130px; background: var(--grass); }
      .bg .lip { position: absolute; left: 0; right: 0; top: 1558px; height: 14px; background: var(--lip); }
      .bg .curb { position: absolute; left: 0; right: 0; top: 1572px; height: 20px; background: var(--curb); }
      .bg .road { position: absolute; left: 0; right: 0; top: 1592px; height: 600px; background: var(--road); }
      .bg .edge { position: absolute; left: 0; right: 0; top: 1610px; height: 9px; background: var(--line); }
      .bg .dashes { position: absolute; left: 0; top: 1748px; width: 2160px; height: 14px; filter: url(#bg-f);
        background: repeating-linear-gradient(90deg, var(--line) 0 108px, transparent 108px 216px); }
    </style>
  </head>

    <script>
      (function () {
        // 144 BPM: one beat = 12.5 frames. Whip-pans are 16 frames, centred on frames 50, 175, 275, 375.
        const F = (f) => f / 30, WH = 16 / 30;
        const tl = gsap.timeline({ paused: true });
        const fe = document.querySelector("#bg-fe"), blur = { b: 0 };
        const setBlur = () => fe.setAttribute("stdDeviation", blur.b.toFixed(2) + " 0");
        [42, 167, 267, 367].forEach((f, i) => {
          // the camera drives one frame-width down the road; patterns repeat so each stop looks the same
          tl.fromTo(".bg .dashes", { x: 0 }, { x: -1080, duration: WH, ease: "power3.inOut" }, F(f));
          tl.fromTo(".bg .hillsB", { x: 0 }, { x: -324, duration: WH, ease: "power3.inOut" }, F(f));
          tl.fromTo(".bg .hillsA", { x: 0 }, { x: -162, duration: WH, ease: "power3.inOut" }, F(f));
          tl.to(".bg .clouds", { x: -(i + 1) * 90, duration: WH, ease: "power3.inOut" }, F(f));
          tl.fromTo(blur, { b: 0 }, { b: 26, duration: WH / 2, ease: "power3.in", onUpdate: setBlur }, F(f));
          tl.to(blur, { b: 0, duration: WH / 2, ease: "power3.out", onUpdate: setBlur }, F(f) + WH / 2);
        });
        setBlur();
        // the old way: the world goes black and white mid-whip, then the squeegee (frame 100) wipes it off
        tl.fromTo("#bgold", { opacity: 0 }, { opacity: 1, duration: F(6), ease: "none" }, F(47));
        tl.fromTo("#bgold", { clipPath: "inset(-50px 0px 0px 0px)" }, { clipPath: "inset(2050px 0px 0px 0px)", duration: 0.5, ease: "power1.inOut" }, F(100));
        tl.set("#bgold", { opacity: 0 }, F(116));
        // the crane up into the clouds (cut at frame 475): the land sinks away
        tl.fromTo(".bg .land", { y: 0 }, { y: 300, duration: F(8), ease: "power4.in" }, F(467));
        tl.fromTo(".bg .clouds", { y: 0 }, { y: 110, duration: F(8), ease: "power4.in" }, F(467));
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
