<template>
  <style>
    @font-face { font-family: "League Gothic"; src: url("assets/fonts/league-gothic-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1; }
    /* line carrier: navy slab, 24 px padding, 12 px darker thickness edge, left at x 72, top at y 1000 */
    .line { position: absolute; inset: 0; z-index: 2; }
    .slab { position: absolute; left: 72px; top: 1000px; padding: 24px; background: #000099; box-shadow: 0 12px 0 #000470; }
    .row { display: block; font-family: "League Gothic", sans-serif; font-size: 150px; line-height: 0.9; letter-spacing: 0; color: #ffffff; white-space: nowrap; }
    .r2 { opacity: 0; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <!-- S1 f0-54: foam pre-soak sheeting off black paint (natural foam sound under the bed) -->
    <video id="hook-s1" class="clip shot" src="assets/footage/s01-foam-sheet.mp4" data-start="0" data-duration="1.8" data-media-start="0.5"
      data-track-index="0" playsinline data-has-audio="true" data-volume="0.25"></video>
    <!-- S2 f54-108: the detailer at the car in a house driveway (plate blurred in the trim) -->
    <video id="hook-s2" class="clip shot" src="assets/footage/s02-detailer-driveway.mp4" data-start="1.8" data-duration="1.8" data-media-start="0.5"
      data-track-index="0" muted playsinline></video>

    <!-- line 1 is on frame 0 (the thumbnail): no entry -->
    <div id="hook-l1" class="clip line" data-start="0" data-duration="1.8" data-track-index="1">
      <div id="hook-l1-slab" class="slab"><span class="row">WASHED IN</span><span class="row">YOUR DRIVEWAY</span></div>
    </div>
    <div id="hook-l2" class="clip line" data-start="1.866667" data-duration="1.733333" data-track-index="1">
      <div id="hook-l2-slab" class="slab"><span class="row">NOW IN</span><span class="row r2">HIGH POINT</span></div>
    </div>
  </div>
  <script>
    (function () {
      // scene starts at film frame 0
      const F = (f) => f / 30;
      const tl = gsap.timeline({ paused: true });
      // a line arrives from 40 px below, opacity binary (the clip window), power4.out over 5 frames;
      // its second row shows 2 frames later and travels 26 px. A landed line never moves.
      const line = (id, t) => {
        tl.fromTo(`#${id}-slab`, { y: 40 }, { y: 0, duration: F(5), ease: "power4.out" }, t);
        tl.set(`#${id} .r2`, { opacity: 1 }, t + F(2));
        tl.fromTo(`#${id} .r2`, { y: 26 }, { y: 0, duration: F(5), ease: "power4.out" }, t + F(2));
      };
      line("hook-l2", F(56));
      window.__timelines = window.__timelines || {};
      window.__timelines["hook"] = tl;
    })();
  </script>
