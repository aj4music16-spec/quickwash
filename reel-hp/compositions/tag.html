  <script>
    (function () {
      // Film frames at 30 fps. 100 BPM = 18 frames a beat. This scene starts at film frame 0.
      const F = (f) => f / 30;
      const tl = gsap.timeline({ paused: true });
      const grommet = "radial-gradient(circle at 220px 48px, transparent 10px, #000 10.5px)";
      const hole = (i) => `radial-gradient(circle at ${80 + 56 * i}px 550px, transparent 15px, #000 15.5px)`;
      const mask = (n) => [grommet].concat(Array.from({ length: n }, (_, i) => hole(i))).join(", ");

      // Punches 1-6 on the first frame of S3-S8 (f108, 144, 180, 216, 252, 288): the hole opens in one
      // frame and the punch knocks the tag 6 px down; it returns over 4 frames. No other tag motion.
      for (let i = 0; i < 6; i++) {
        const t = F(108 + 36 * i), m = mask(i + 1);
        tl.set("#tag-front-card", { webkitMaskImage: m, maskImage: m }, t);
        tl.set("#tag-rim" + (i + 1), { opacity: 1 }, t);
        tl.fromTo("#tag-kick", { y: 6 }, { y: 0, duration: F(4), ease: "power2.out", immediateRender: false }, t);
      }

      // S9 payoff (f324-336): the tag turns over about the grommet, front swaps to back at 90 degrees,
      // and grows 1.00 -> 1.20 to land at x 80-608, y 220-964.
      tl.fromTo("#tag-flip", { rotationY: 0, transformOrigin: "220px 48px" }, { rotationY: 180, duration: F(12), ease: "power3.inOut" }, F(324));
      tl.fromTo("#tag-grow", { scale: 1, x: 0, y: 0, transformOrigin: "220px 48px" }, { scale: 1.2, x: 44, y: 9.6, duration: F(12), ease: "power3.inOut" }, F(324));

      // End card (f504): pulled up out of frame on its string in 12 frames, power4.in.
      tl.fromTo("#tag-pull", { y: 0 }, { y: -1080, duration: F(12), ease: "power4.in" }, F(504));

      window.__timelines = window.__timelines || {};
      window.__timelines["tag"] = tl;
    })();
