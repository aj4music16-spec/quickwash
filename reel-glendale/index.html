<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"navy","type":"color","label":"Brand navy","default":"#000099"},
    {"id":"accent","type":"color","label":"Brand orange","default":"#ff6600"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Inter, sans-serif; }
      #stage { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <!-- "The $99 Tag" v6 (Meta lead form) - QuickWash, Glendale CA variant. 1080x1920, 30 fps, 660 frames; cuts on a 0.6 s grid. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">
      <div id="stage" data-layout-ignore></div>

      <!-- A. HOOK 0-3.6: four real dirty-car shots; the Glendale chip and the question on frame 0 -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.6"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <!-- B. OFFER 3.6-6.0: past the QuickWash van, foam sheet; the tag drops in -->
      <div id="offer" data-composition-id="offer" data-composition-src="compositions/offer.html" data-start="3.6" data-duration="2.4"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <!-- C. SERVICES 6.0-12.6: the service shots, 1.1 s each -->
      <div id="services" data-composition-id="services" data-composition-src="compositions/services.html" data-start="6" data-duration="6.6"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <!-- D. PAYOFF 12.6-15.6: the finished car; the tag flips to INSIDE & OUT / $99 -->
      <div id="payoff" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="12.6" data-duration="3"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <!-- the package checklist over the services and the payoff (rows from 6.0 s; leaves with the urgency cut at 15.6 s) -->
      <div id="checklist" data-composition-id="checklist" data-composition-src="compositions/checklist.html" data-start="5.8" data-duration="9.8"
        data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <!-- E. URGENCY 15.6-18.0 (the shot runs on under the end-card wipe to 18.4) -->
      <div id="urgency" data-composition-id="urgency" data-composition-src="compositions/urgency.html" data-start="15.6" data-duration="2.8"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <!-- F. END CARD 18.0-22.0: lead-form call to action -->
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="18" data-duration="4"
        data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 7"></div>
      <!-- the hang tag, from the offer to the end-card pull (3.6-18.4) -->
      <div id="tag" data-composition-id="tag" data-composition-src="compositions/tag.html" data-start="3.6" data-duration="14.8"
        data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 8"></div>

      <!-- premix: ElevenLabs acoustic bed + Chris VO, ducked (tools/mix.sh) -->
      <audio id="bed" class="clip" data-start="0" data-duration="22" data-track-index="4" data-volume="1" src="assets/audio/mix-glendale.m4a"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
