<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.f{width:1080px;height:1920px;position:relative;display:none;font-family:Inter,sans-serif}
.on{display:block}
.t{position:absolute;left:90px;right:90px;text-align:center;color:#fff;font-weight:700;font-size:78px;letter-spacing:-1.2px;line-height:1.12;
 text-shadow:0 2px 2px rgba(0,0,0,.7),0 0 18px rgba(0,0,0,.55),0 6px 34px rgba(0,0,0,.5)}
.pill{position:absolute;left:60px;right:60px;text-align:center;font-weight:700;font-size:66px;letter-spacing:-1px;line-height:1.42}
.pill span{background:#fff;color:#111;padding:6px 24px;border-radius:16px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.card{position:absolute;left:50%;transform:translateX(-50%);top:640px;width:640px;border-radius:40px;overflow:hidden;
 box-shadow:0 24px 60px rgba(0,0,0,.4)}
.card img{display:block;width:100%}
</style></head><body>
<div class="f" id="c_hook"><div class="pill" style="top:300px"><span>Your car gets detailed</span><br><span>while you work out</span></div></div>
<div class="f" id="c_come"><div class="t" style="top:330px">We come to you</div></div>
<div class="f" id="book"><div class="t" style="top:470px;white-space:nowrap;left:0;right:0;font-size:74px">Book in under 20 seconds</div><div class="card"><img src="book_crop.png"></div></div>
<div class="f" id="c_keys"><div class="t" style="top:1180px">Hand off your keys</div></div>
<div class="f" id="c_train"><div class="t" style="top:1180px">Go train</div></div>
<div class="f" id="c_lift"><div class="t" style="top:1180px">You lift…</div></div>
<div class="f" id="c_detail"><div class="t" style="top:1180px">…we detail</div></div>
<div class="f" id="c_chest"><div class="t" style="top:1140px">Chest day?<br>Same deal.</div></div>
<div class="f" id="c_walk"><div class="t" style="top:1180px">Walk out to a…</div></div>
<div class="f" id="c_spot"><div class="t" style="top:1180px">…spotless ride</div></div>
<div class="f" id="c_quote"><div class="t" style="top:1180px">“Wow, it’s so good.”</div></div>
</body></html>
