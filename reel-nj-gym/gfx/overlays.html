<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:LG;src:url(LG.woff)}
html,body{margin:0;background:transparent}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:LG;display:none}
.on{display:block}
.hl{position:absolute;left:0;right:0;text-align:center;color:#fff;text-transform:uppercase;line-height:.92;
 text-shadow:0 6px 0 rgba(0,0,0,.35)}
.slab{background:#f8630a;color:#fff;padding:0 22px;display:inline-block;text-shadow:none}
.card{position:absolute;left:50%;transform:translateX(-50%) rotate(-2deg);top:640px;width:640px;border-radius:44px;overflow:hidden;
 box-shadow:0 30px 60px rgba(0,0,0,.45);border:10px solid #fff;background:#fff}
.card img{display:block;width:100%}
.tap{position:absolute;left:50%;top:1395px;width:150px;height:150px;margin-left:-75px;border-radius:50%;border:12px solid #f8630a;opacity:.0}
/* end card */
#end .top{position:absolute;left:0;right:0;top:0;height:1000px;background:linear-gradient(#000099 0%,#000099 62%,rgba(0,0,153,0) 100%)}
#end .logo{position:absolute;top:250px;left:50%;margin-left:-120px;width:240px;height:240px;background:#fff;border-radius:56px;padding:18px;box-sizing:border-box}
#end .logo img{width:100%}
#end .bot{position:absolute;left:0;right:0;top:1180px;height:740px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55) 30%)}
.badges{position:absolute;top:1410px;left:0;right:0;text-align:center}
.badges img{height:96px;margin:0 14px}
.small{font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:.5px}
</style></head><body>
<div class="f" id="book">
 <div class="hl" style="top:330px;font-size:150px">BOOK IN UNDER<br><span class="slab">20 SECONDS</span></div>
 <div class="card"><img src="book_crop.png"></div>
</div>
<div class="f" id="end">
 <div class="top"></div>
 <div class="logo"><img src="logo.png"></div>
 <div class="hl" style="top:530px;font-size:170px">QUICKWASH</div>
 <div class="hl" style="top:700px;font-size:96px">WE COME <span class="slab">TO YOU.</span></div>
 <div class="bot"></div>
 <div class="hl small" style="top:1220px;font-size:38px">MOBILE WASHES &amp; DETAILS · NEW JERSEY</div>
 <div class="hl" style="top:1285px;font-size:110px"><span class="slab">DOWNLOAD QUICKWASH</span></div>
 <div class="badges"><img src="app-store-badge.svg"><img src="google-play-badge.svg"></div>
</div>
</body></html>
