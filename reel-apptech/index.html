<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"navy","type":"color","label":"Brand navy","default":"#000099"},
    {"id":"accent","type":"color","label":"Brand orange","default":"#ff6600"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4f6fb; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f4f6fb; font-family: Inter, sans-serif; }
      #stage { position: absolute; inset: 0; background: #f4f6fb; }
    </style>
  </head>
  <body>
    <!-- "Your car wash is now an app" v2 - QuickWash app product film. 1080x1920, 30 fps, 24.5 s (735 frames). Picture timed to the VO word onsets in tools/cues.json. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.5" data-width="1080" data-height="1920">
      <div id="stage" data-layout-ignore></div>

      <!-- 1. HOOK 0-2.8: c14 floating phone; the clean home screen is corner-pinned onto it on "It's an app" -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="2.8"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <!-- 2+3. BOOK 2.8-9.3 and GARAGE 9.3-13.4: our CSS phone with the real screens, taps, callouts, timer -->
      <div id="app" data-composition-id="app" data-composition-src="compositions/app.html" data-start="2.8" data-duration="10.6"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <!-- 4. DISPATCH 13.4-14.9: c03 illustrated van morphing into the van on the road -->
      <div id="dispatch" data-composition-id="dispatch" data-composition-src="compositions/dispatch.html" data-start="13.4" data-duration="1.5"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <!-- 5. ANYWHERE 14.9-21.0: four 3:2 diorama cards, each cut on its spoken word -->
      <div id="anywhere" data-composition-id="anywhere" data-composition-src="compositions/anywhere.html" data-start="14.9" data-duration="6.1"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <!-- 6. END 21.0-24.5 -->
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="21" data-duration="3.5"
        data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>

      <!-- premix: ElevenLabs bed + eleven_v3 VO (Liam) + UI sounds, ducked, -14 LUFS (tools/mix.py liam); alt cut swaps in mix-jessica.m4a -->
      <audio id="mix" class="clip" data-start="0" data-duration="24.5" data-track-index="4" data-volume="1" src="assets/audio/mix-liam.m4a"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
