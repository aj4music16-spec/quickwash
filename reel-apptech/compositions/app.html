  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // ---------- intro: the phone arrives from the hook phone's place and settles (expo) ----------
      tl.fromTo("#ap-grid", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#ap-phone", { x: -102, y: 36, scale: 0.8, rotation: 3, transformOrigin: "0 0" },
        { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo("#ap-timer", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0.25);

      // hidden states (set at 0 so the first frame is right)
      // leader lines draw on with stroke-dashoffset (dash 1200 > the longest path, ~850)
      const drawLine = (g, t) => {
        tl.set(g, { opacity: 1 }, t);
        tl.fromTo(g + " path", { strokeDasharray: 1200, strokeDashoffset: 1200 }, { strokeDashoffset: 0, duration: 0.4, ease: "expo.out" }, t);
        tl.fromTo(g + " circle", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t + 0.28);
      };
      const callout = (c, t) => tl.fromTo(c, { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t);
      // tap: soft ring ripple at a point in screenshot pixels
      const tap = (x, y, t) => {
        tl.set("#ap-tap", { x, y, opacity: 1 }, t);
        tl.fromTo("#ap-tap b", { scale: 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12, ease: "power2.out" }, t);
        tl.to("#ap-tap b", { scale: 0.82, duration: 0.08, ease: "power2.in" }, t + 0.14);
        tl.to("#ap-tap b", { scale: 1, duration: 0.16, ease: "power2.out" }, t + 0.22);
        tl.fromTo("#ap-tap s", { scale: 1, opacity: 0.8 }, { scale: 2.5, opacity: 0, duration: 0.55, ease: "expo.out" }, t + 0.16);
        tl.to("#ap-tap b", { opacity: 0, duration: 0.18, ease: "power2.out" }, t + 0.42);
      };

      // ---------- STEP 1 pick your car (VO "Pick your car" 0.80) ----------
      callout("#ap-c1", 0.75); drawLine("#ap-l1", 0.8);
      tap(344, 700, 0.85);
      tl.fromTo("#ap-hl-card", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 1.0);
      tl.to("#ap-hl-card", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 1.55);
      tl.to("#ap-l1", { opacity: 0, duration: 0.25, ease: "power2.out" }, 1.6);
      // ---------- STEP 2 pick a service (VO 1.77) ----------
      callout("#ap-c2", 1.7); drawLine("#ap-l2", 1.72);
      tap(700, 1863, 1.8);
      tl.fromTo("#ap-hl-row", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 1.95);
      tl.to("#ap-l2", { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.05);
      // the sheet opens: Book an Appointment
      tl.to("#ap-s-book", { opacity: 1, duration: 0.16, ease: "power2.out" }, 2.15);
      tl.fromTo("#ap-s-book", { scale: 1.03, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "expo.out" }, 2.15);
      tl.to("#ap-hl-row", { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.2);
      // ---------- STEP 3 pick a time (VO 2.49) ----------
      callout("#ap-c3", 2.45); drawLine("#ap-l3", 2.5);
      tap(659, 1278, 2.6);
      tl.fromTo("#ap-hl-time", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 2.75);
      tl.to("#ap-l3", { opacity: 0, duration: 0.25, ease: "power2.out" }, 3.2);
      // Book This Slot
      tap(659, 2135, 3.25);
      tl.fromTo("#ap-hl-book", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.in" }, 3.38);
      tl.to("#ap-hl-book", { opacity: 0, duration: 0.25, ease: "power2.out" }, 3.5);
      tl.to("#ap-hl-time", { opacity: 0, duration: 0.3, ease: "power2.out" }, 3.55);
      // Booked ✓ (VO "Booked in twenty seconds" 3.63)
      tl.fromTo("#ap-booked", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 3.55);
      tl.fromTo("#ap-booked i", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, 3.68);
      tl.fromTo("#ap-head", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 3.65);
      // the stopwatch: 0:00 -> 0:20 between the first tap and the booking
      const c = { v: 0 }, el = document.querySelector("#ap-count");
      tl.fromTo(c, { v: 0 }, { v: 20, duration: 2.95, ease: "none", onUpdate: () => { el.textContent = "0:" + String(Math.floor(c.v + 1e-6)).padStart(2, "0"); } }, 0.6);
      tl.to("#ap-count", { color: "#ff6600", duration: 0.2, ease: "power2.out" }, 3.55);
      // hold: the phone takes a slow push toward the confirmation
      tl.to("#ap-phone", { scale: 1.035, x: -12, y: 0, duration: 2.0, ease: "power1.inOut" }, 3.7);

      // ---------- to GARAGE ----------
      tl.to(["#ap-timer", "#ap-head", "#ap-c1", "#ap-c2", "#ap-c3"], { opacity: 0, y: -30, duration: 0.25, ease: "power3.in", stagger: 0.02 }, 5.72);
      tl.to("#ap-phone", { x: -311, y: -110, scale: 1.35, duration: 0.7, ease: "expo.inOut" }, 5.75);
      tl.set("#ap-s-garage", { opacity: 1 }, 5.95);
      tl.fromTo("#ap-s-garage", { xPercent: 100 }, { xPercent: 0, duration: 0.5, ease: "expo.out" }, 5.95);
      tl.fromTo("#ap-gh span", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", stagger: 0.1 }, 6.08);
      [["#ap-g1", "#ap-gc1"], ["#ap-g2", "#ap-gc2"], ["#ap-g3", "#ap-gc3"]].forEach(([g, chip], i) => {
        const t = 6.55 + i * 0.16;
        tl.fromTo(g + " circle", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t);
        tl.fromTo(g + " path", { strokeDasharray: 72, strokeDashoffset: 72 }, { strokeDashoffset: 0, duration: 0.3, ease: "expo.out" }, t + 0.05);
        tl.fromTo(chip, { opacity: 0, xPercent: -50, y: 20 }, { opacity: 1, xPercent: -50, y: 0, duration: 0.4, ease: "expo.out" }, t + 0.12);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["app"] = tl;
    })();
  </script>
