  <script>
    (function () {
      // Every time below is a word onset of the main VO (Liam) from tools/cues.json, in this scene's local time
      // (film - 2.8). Taps "land" on the press frame, which is the word onset.
      const C = { pick1: 0.35, car: 0.71, pick2: 1.38, wash: 1.76, pick3: 2.47, time: 2.73, and: 3.4, booked: 4.78, twenty: 5.79,
                  garage: 6.5, every: 7.1, right: 8.3, repeat: 9.58 };
      const tl = gsap.timeline({ paused: true });
      // ---------- intro: the phone arrives from the hook phone's place and settles (expo) ----------
      tl.fromTo("#ap-grid", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#ap-phone", { x: -102, y: 36, scale: 0.8, rotation: 3, transformOrigin: "0 0" },
        { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo("#ap-timer", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0.1);

      // leader lines draw on with stroke-dashoffset (dash 1200 > the longest path, ~850)
      const drawLine = (g, t) => {
        tl.set(g, { opacity: 1 }, t);
        tl.fromTo(g + " path", { strokeDasharray: 1200, strokeDashoffset: 1200 }, { strokeDashoffset: 0, duration: 0.35, ease: "expo.out" }, t);
        tl.fromTo(g + " circle", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(2.4)" }, t + 0.2);
      };
      const callout = (c, t) => tl.fromTo(c, { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t);
      // tap: soft ring ripple at a point in screenshot pixels; the ring arrives 0.14 s early and presses on t
      const tap = (x, y, t) => {
        tl.set("#ap-tap", { x, y, opacity: 1 }, t - 0.14);
        tl.fromTo("#ap-tap b", { scale: 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12, ease: "power2.out" }, t - 0.14);
        tl.to("#ap-tap b", { scale: 0.82, duration: 0.07, ease: "power2.in" }, t - 0.02);
        tl.to("#ap-tap b", { scale: 1, duration: 0.16, ease: "power2.out" }, t + 0.06);
        tl.fromTo("#ap-tap s", { scale: 1, opacity: 0.8 }, { scale: 2.5, opacity: 0, duration: 0.55, ease: "expo.out" }, t + 0.02);
        tl.to("#ap-tap b", { opacity: 0, duration: 0.18, ease: "power2.out" }, t + 0.3);
      };

      // ---------- "Pick your car." ----------
      callout("#ap-c1", C.pick1); drawLine("#ap-l1", C.pick1 + 0.02);
      tap(344, 700, C.car);
      tl.fromTo("#ap-hl-card", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, C.car);
      tl.to("#ap-hl-card", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, C.pick2 - 0.15);
      tl.to("#ap-l1", { opacity: 0, duration: 0.2, ease: "power2.out" }, C.pick2 - 0.15);
      // ---------- "Pick your wash." ----------
      callout("#ap-c2", C.pick2); drawLine("#ap-l2", C.pick2 + 0.02);
      tap(700, 1863, C.wash);
      tl.fromTo("#ap-hl-row", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, C.wash);
      tl.to("#ap-l2", { opacity: 0, duration: 0.18, ease: "power2.out" }, C.wash + 0.22);
      // the Book an Appointment sheet opens
      tl.to("#ap-s-book", { opacity: 1, duration: 0.16, ease: "power2.out" }, C.wash + 0.3);
      tl.fromTo("#ap-s-book", { scale: 1.03, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "expo.out" }, C.wash + 0.3);
      tl.to("#ap-hl-row", { opacity: 0, duration: 0.15, ease: "power2.out" }, C.wash + 0.32);
      // ---------- "Pick a time." ----------
      callout("#ap-c3", C.pick3); drawLine("#ap-l3", C.pick3 + 0.02);
      tap(659, 1278, C.time);
      tl.fromTo("#ap-hl-time", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, C.time);
      tl.to("#ap-l3", { opacity: 0, duration: 0.2, ease: "power2.out" }, C.and - 0.1);
      // "And..." - Book This Slot glows while he holds the word
      tl.fromTo("#ap-hl-ready", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, C.and);
      tl.to("#ap-hl-ready", { opacity: 0.45, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, C.and + 0.4);
      // "...booked." - the tap and the chip on the word
      tap(659, 2135, C.booked);
      tl.to("#ap-hl-ready", { opacity: 0, duration: 0.15, ease: "power2.out" }, C.booked);
      tl.fromTo("#ap-hl-book", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power2.in" }, C.booked - 0.02);
      tl.to("#ap-hl-book", { opacity: 0, duration: 0.25, ease: "power2.out" }, C.booked + 0.12);
      tl.to("#ap-hl-time", { opacity: 0, duration: 0.3, ease: "power2.out" }, C.booked + 0.1);
      tl.fromTo("#ap-booked", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, C.booked);
      tl.fromTo("#ap-booked i", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, C.booked + 0.1);
      // "About twenty seconds." - the clock reads 0:20 and the headline lands on "twenty"
      const c = { v: 0 }, el = document.querySelector("#ap-count");
      tl.fromTo(c, { v: 0 }, { v: 20, duration: C.twenty - C.pick1, ease: "none", onUpdate: () => { el.textContent = "0:" + String(Math.floor(c.v + 1e-6)).padStart(2, "0"); } }, C.pick1);
      tl.to("#ap-count", { color: "#ff6600", duration: 0.15, ease: "power2.out" }, C.twenty);
      tl.fromTo("#ap-timer", { scale: 1 }, { scale: 1.12, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0% 50%" }, C.twenty);
      tl.fromTo("#ap-head", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, C.twenty);
      tl.to("#ap-phone", { scale: 1.02, x: -8, duration: C.garage - 0.2 - C.booked, ease: "power1.inOut" }, C.booked + 0.1);

      // ---------- to GARAGE: the screen is up before "Every car" ----------
      tl.to(["#ap-timer", "#ap-head", "#ap-c1", "#ap-c2", "#ap-c3"], { opacity: 0, y: -30, duration: 0.22, ease: "power3.in", stagger: 0.02 }, C.garage - 0.2);
      tl.to("#ap-phone", { x: -311, y: -110, scale: 1.35, duration: 0.6, ease: "expo.inOut" }, C.garage);
      tl.set("#ap-s-garage", { opacity: 1 }, C.garage + 0.05);
      tl.to("#ap-booked", { opacity: 0, duration: 0.2, ease: "power2.out" }, C.garage + 0.3);
      tl.fromTo("#ap-s-garage", { xPercent: 100 }, { xPercent: 0, duration: 0.45, ease: "expo.out" }, C.garage + 0.05);
      tl.fromTo("#ap-gh span", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.12 }, C.every);
      // "Right here." - the three actions; "repeat" - Set Recurring lights up
      [["#ap-g1", "#ap-gc1"], ["#ap-g2", "#ap-gc2"], ["#ap-g3", "#ap-gc3"]].forEach(([g, chip], i) => {
        const t = C.right + i * 0.1;
        tl.fromTo(g + " circle", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t);
        tl.fromTo(g + " path", { strokeDasharray: 72, strokeDashoffset: 72 }, { strokeDashoffset: 0, duration: 0.3, ease: "expo.out" }, t + 0.04);
        tl.fromTo(chip, { opacity: 0, xPercent: -50, y: 20 }, { opacity: 1, xPercent: -50, y: 0, duration: 0.4, ease: "expo.out" }, t + 0.08);
      });
      tl.to("#ap-gc3", { backgroundColor: "#ff6600", scale: 1.12, duration: 0.25, ease: "back.out(2.5)" }, C.repeat);
      tl.to(["#ap-gc1", "#ap-gc2"], { opacity: 0.55, duration: 0.25, ease: "power2.out" }, C.repeat);
      tl.fromTo("#ap-hl-rec", { opacity: 0, scale: 1.15, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, C.repeat);
      window.__timelines = window.__timelines || {};
      window.__timelines["app"] = tl;
    })();
  </script>
