<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    /* the race timer: like reel-apptech's "0:00 to book" pill, bigger; top-left inside the safe zone */
    #tm-pill { position: absolute; left: 64px; top: 190px; width: 460px; height: 132px; border-radius: 34px; background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 16px 40px rgba(0, 0, 40, 0.28); font-family: Inter, sans-serif; }
    #tm-pill svg { position: absolute; left: 26px; top: 26px; width: 62px; height: 62px; }
    #tm-now { position: absolute; left: 104px; top: 14px; color: var(--navy, #000099); font-weight: 800; font-size: 80px; line-height: 92px;
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    #tm-goal { position: absolute; left: 290px; top: 40px; color: #5a6185; font-weight: 600; font-size: 40px; line-height: 50px; font-variant-numeric: tabular-nums; }
    /* thin progress bar toward the 0:20 mark */
    #tm-track { position: absolute; left: 26px; right: 26px; bottom: 16px; height: 8px; border-radius: 4px; background: rgba(0, 0, 153, 0.14); }
    #tm-fill { position: absolute; left: 0; top: 0; width: 100%; height: 8px; border-radius: 4px; background: var(--accent, #ff6600); transform-origin: 0 50%; transform: scaleX(0); }
  </style>
  <div id="root" data-composition-id="timer" data-width="1080" data-height="1920">
    <div id="tm-pill" class="clip" data-start="0" data-duration="19.5687" data-track-index="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="8" fill="none" stroke="#000099" stroke-width="2.2" /><path d="M12 13.5V9.5M9.5 2.8h5M18.6 6.4l1.4-1.4" stroke="#ff6600" stroke-width="2.2" stroke-linecap="round" fill="none" /></svg>
      <span id="tm-now">0:00</span><span id="tm-goal">/ 0:20</span>
      <div id="tm-track"><div id="tm-fill"></div></div>
    </div>
  </div>
  <script>
    (function () {
      // REAL TIME: from the VO word "Go" the display is the seconds since Go (m:ss, floored) and the bar fills toward 0:20.
      // It stops on the word "Done". GO / DONE are frame-snapped word onsets written by tools/apply_cues.py.
      const GO = 4.7333, DONE = 17.9333, el = document.querySelector("#tm-now"), fill = document.querySelector("#tm-fill");
      const c = { s: 0 };
      const show = () => { const s = Math.floor(c.s + 1e-6); el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); fill.style.transform = `scaleX(${c.s / 20})`; };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(c, { s: 0 }, { s: DONE - GO, duration: DONE - GO, ease: "none", onUpdate: show }, GO);
      // "Go": the pill kicks once as the clock starts
      tl.fromTo("#tm-pill", { scale: 1 }, { scale: 1.08, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0% 50%" }, GO);
      // "Done": the clock stops, turns orange and pulses twice
      tl.to("#tm-now", { color: "#ff6600", duration: 0.1, ease: "power2.out" }, DONE);
      tl.fromTo("#tm-pill", { scale: 1 }, { scale: 1.14, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 3, transformOrigin: "0% 50%", immediateRender: false }, DONE);
      window.__timelines = window.__timelines || {};
      window.__timelines["timer"] = tl;
    })();
  </script>
</template>
